version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: prowider_postgres
    environment:
      POSTGRES_USER: prowider
      POSTGRES_PASSWORD: prowider_secure_password
      POSTGRES_DB: prowider
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prowider"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: prowider_app
    environment:
      DATABASE_URL: postgresql://prowider:prowider_secure_password@postgres:5432/prowider
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --skip-generate &&
             npm run db:seed &&
             npm start"

volumes:
  postgres_data:
