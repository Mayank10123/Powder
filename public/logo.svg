<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- Main diamond/provider icon -->
  <g transform="translate(100, 100)">
    <!-- Central hub -->
    <circle cx="0" cy="0" r="12" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
    
    <!-- Surrounding provider nodes -->
    <circle cx="0" cy="-45" r="10" fill="#3b82f6" stroke="#1f2937" stroke-width="2"/>
    <circle cx="45" cy="0" r="10" fill="#3b82f6" stroke="#1f2937" stroke-width="2"/>
    <circle cx="0" cy="45" r="10" fill="#3b82f6" stroke="#1f2937" stroke-width="2"/>
    <circle cx="-45" cy="0" r="10" fill="#3b82f6" stroke="#1f2937" stroke-width="2"/>
    
    <!-- Diagonal provider nodes -->
    <circle cx="32" cy="-32" r="8" fill="#60a5fa" stroke="#1f2937" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="8" fill="#60a5fa" stroke="#1f2937" stroke-width="1.5"/>
    <circle cx="-32" cy="32" r="8" fill="#60a5fa" stroke="#1f2937" stroke-width="1.5"/>
    <circle cx="-32" cy="-32" r="8" fill="#60a5fa" stroke="#1f2937" stroke-width="1.5"/>
    
    <!-- Connection lines to main hub -->
    <line x1="0" y1="0" x2="0" y2="-45" stroke="#1f2937" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="0" y1="0" x2="45" y2="0" stroke="#1f2937" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="0" y1="0" x2="0" y2="45" stroke="#1f2937" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="0" y1="0" x2="-45" y2="0" stroke="#1f2937" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Connection lines to diagonal nodes -->
    <line x1="0" y1="0" x2="32" y2="-32" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="32" y2="32" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="-32" y2="32" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="-32" y2="-32" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Text below logo -->
  <text x="100" y="180" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937" font-family="Arial, sans-serif">
    POWDER
  </text>
</svg>
